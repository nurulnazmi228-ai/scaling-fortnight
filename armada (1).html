<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perang Armada: Bilangan Bulat</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1730;--pn:#102a52;--ln:#2c5aa0;--cy:#4fd8ff;--tx:#eaf4ff;--mu:#9db8d8;--ok:#3ddc84;--no:#ff6b7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{font-size:clamp(16px,1.4vw + 9px,24px)}
body{margin:0;background:radial-gradient(circle at 50% 0,#14345f,var(--bg) 60%) fixed;color:var(--tx);font-family:'Baloo 2',system-ui,'Segoe UI',sans-serif;min-height:100vh;line-height:1.3}
#app{max-width:960px;margin:0 auto;padding:14px}
h1{margin:6px 0;font-size:2.1rem;line-height:1.05}
.mu{color:var(--mu)}
.rl{padding-left:1.3rem;margin:10px 0}.rl li{margin-bottom:6px}
.tb{height:10px;border-radius:6px;background:#0a1d3d;border:1px solid var(--ln);overflow:hidden;margin-top:10px}
#tbf{height:100%;width:100%;background:var(--ok);transition:width .25s linear,background .3s}
.hm{color:var(--cy);font-weight:700;text-decoration:none}
.pn{background:var(--pn);border:2px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-weight:800;color:var(--tx);background:#173b6e;border:2px solid var(--ln);border-radius:12px;min-height:48px;padding:6px 16px;cursor:pointer}
.btn.on{border-color:var(--cy);background:#1d4d8c;box-shadow:0 0 12px #4fd8ff66}
.btn.go{background:var(--cy);color:#06223a;border-color:var(--cy)}
.btn[disabled]{opacity:.4;cursor:default}
.btn:focus-visible,.sc:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tm{flex:1;min-width:120px;border:2px solid;border-radius:12px;padding:6px 10px;background:#0c2142;font-size:.9rem}
.tm.t{box-shadow:0 0 0 3px #fff}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media(min-width:600px){.board{grid-template-columns:repeat(10,1fr);gap:8px}}
.sc{font:inherit;font-weight:800;font-size:1.15rem;color:var(--mu);background:var(--pn);border:2px solid var(--ln);border-radius:10px;min-height:58px;padding:0;cursor:pointer}
.md{position:fixed;inset:0;background:#030a16e6;display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.md[hidden]{display:none}
.mc{background:var(--pn);border:2px solid var(--cy);border-radius:18px;padding:16px;width:100%;max-width:640px;max-height:92vh;overflow:auto;box-shadow:0 0 30px #4fd8ff55}
.qt{font-size:1.4rem;font-weight:700;line-height:1.35;background:#0a1d3d;border-radius:12px;padding:12px;margin:10px 0}
input{font:inherit;font-weight:800;font-size:1.6rem;text-align:center;width:100%;height:56px;border-radius:12px;border:2px solid var(--cy);background:#061226;color:var(--tx)}
.fb{border-radius:12px;padding:10px 12px;margin-top:10px}
.fb.ok{background:#12452b;color:var(--ok)}.fb.no{background:#4a1c27;color:var(--no)}
.fb span{display:block;color:var(--tx);font-weight:500;font-size:.95rem}
.rk{display:flex;gap:12px;align-items:center;border-left:6px solid;padding:8px 10px;margin:6px 0;background:#0c2142;border-radius:10px;font-size:1.2rem}
.rk span:last-child{margin-left:auto;color:var(--mu);font-size:.95rem}
</style>
</head>
<body>
<div id="app"></div>
<div id="md" class="md" hidden></div>
<script>
const T=[{n:'Armada Merah',c:'#ff5a6e',f:'#fff'},{n:'Armada Biru',c:'#4d8dff',f:'#fff'},{n:'Armada Hijau',c:'#3ddc84',f:'#06210f'},{n:'Armada Kuning',c:'#ffd23f',f:'#2a2000'}];
const app=document.getElementById('app'),md=document.getElementById('md'),g=i=>document.getElementById(i);
let G={n:4,mode:'cam',t:60},TM=null;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,nz=(a,b)=>{let x=0;while(!x)x=rnd(a,b);return x},pick=a=>a[rnd(0,a.length-1)];
const s=n=>String(n).replace('-','\u2212'),p=n=>n<0?'('+s(n)+')':s(n);

function calc(){
 const t=pick(['add','sub','mul','div','tri','mix']);let a,b,c;
 if(t==='add'){a=rnd(-15,15);b=rnd(-15,15);return{x:`${s(a)} + ${p(b)}`,ans:a+b,h:`Tanda sama: jumlahkan. Tanda beda: kurangkan, ikut tanda yang lebih besar. Hasilnya ${s(a+b)}.`}}
 if(t==='sub'){a=rnd(-15,15);b=rnd(-15,15);return{x:`${s(a)} \u2212 ${p(b)}`,ans:a-b,h:`${s(a)} \u2212 ${p(b)} = ${s(a)} + ${p(-b)} = ${s(a-b)}.`}}
 if(t==='mul'){a=nz(-9,9);b=nz(-9,9);return{x:`${s(a)} \u00d7 ${p(b)}`,ans:a*b,h:`Tanda sama hasilnya positif, tanda beda hasilnya negatif: ${s(a*b)}.`}}
 if(t==='div'){b=nz(-9,9);c=nz(-9,9);a=b*c;return{x:`${s(a)} \u00f7 ${p(b)}`,ans:c,h:`Aturan tandanya sama dengan perkalian. Hasilnya ${s(c)}.`}}
 if(t==='tri'){a=rnd(-12,12);b=rnd(-12,12);c=rnd(-12,12);return{x:`${s(a)} + ${p(b)} \u2212 ${p(c)}`,ans:a+b-c,h:`Dari kiri: ${s(a)} + ${p(b)} = ${s(a+b)}, lalu ${s(a+b)} \u2212 ${p(c)} = ${s(a+b-c)}.`}}
 a=rnd(-10,10);b=nz(-6,6);c=nz(-6,6);
 return{x:`${s(a)} + ${p(b)} \u00d7 ${p(c)}`,ans:a+b*c,h:`Kali dulu: ${p(b)} \u00d7 ${p(c)} = ${s(b*c)}, lalu ${s(a)} + ${p(b*c)} = ${s(a+b*c)}.`}
}
const ST=[
()=>{const a=rnd(-9,9),k=rnd(2,9),u=Math.random()<.5,d=u?k:-k;return{st:1,x:`Pagi hari, suhu di puncak gunung ${s(a)}\u00b0C. ${u?'Menjelang siang suhu naik':'Menjelang malam suhu turun'} ${k}\u00b0C. Berapa suhu sekarang?`,ans:a+d,h:`${s(a)} + ${p(d)} = ${s(a+d)}.`}},
()=>{const a=rnd(-3,8),k=rnd(2,6),u=Math.random()<.5,d=u?k:-k;return{st:1,x:`Lift berada di lantai ${s(a)} (lantai negatif berarti basement). Lift ${u?'naik':'turun'} ${k} lantai. Di lantai berapa lift sekarang?`,ans:a+d,h:`${s(a)} + ${p(d)} = ${s(a+d)}.`}},
()=>{const a=rnd(-9,9),b=rnd(-9,9);return{st:1,x:`Suhu kota A adalah ${s(a)}\u00b0C dan suhu kota B adalah ${s(b)}\u00b0C. Berapa selisih suhu kota A terhadap kota B (A \u2212 B)?`,ans:a-b,h:`${s(a)} \u2212 ${p(b)} = ${s(a)} + ${p(-b)} = ${s(a-b)}.`}},
()=>{const a=rnd(5,30),d=rnd(3,25);return{st:1,x:`Seekor elang terbang di ketinggian ${a} m dari permukaan laut. Seekor ikan berada di kedalaman ${d} m, atau ${s(-d)} m. Berapa jarak vertikal antara elang dan ikan?`,ans:a+d,h:`${a} \u2212 ${p(-d)} = ${a} + ${d} = ${a+d}.`}},
()=>{const k=rnd(2,9),n=rnd(2,9);return{st:1,x:`Sebuah kapal selam turun ${k} meter setiap menit. Berapa perubahan kedalamannya setelah ${n} menit? (Turun dihitung negatif.)`,ans:-k*n,h:`${p(-k)} \u00d7 ${n} = ${s(-k*n)}.`}},
()=>{const k=rnd(2,9),n=rnd(2,8);return{st:1,x:`Air di sebuah kolam berkurang ${k} liter setiap jam selama ${n} jam. Berapa perubahan total volume air? (Berkurang dihitung negatif.)`,ans:-k*n,h:`${p(-k)} \u00d7 ${n} = ${s(-k*n)}.`}},
()=>{const c=rnd(2,9),n=rnd(2,6);return{st:1,x:`Tim penyihir merugi total ${n*c} koin emas. Kerugian dibagi rata ke ${n} penyihir. Berapa perubahan koin tiap penyihir?`,ans:-c,h:`${s(-n*c)} \u00f7 ${n} = ${s(-c)}.`}},
()=>{const c=rnd(2,9),n=rnd(2,6);return{st:1,x:`Suhu dalam freezer turun total ${n*c}\u00b0C secara tetap selama ${n} jam. Berapa perubahan suhu setiap jam? (Turun dihitung negatif.)`,ans:-c,h:`${s(-n*c)} \u00f7 ${n} = ${s(-c)}.`}},
()=>{const a=rnd(0,15),n=rnd(2,5),k=rnd(2,6);return{st:1,x:`Kamu punya ${a} koin, lalu membeli ${n} ramuan seharga ${k} koin per ramuan. Jika koin kurang, saldo boleh negatif (berutang). Berapa saldo koinmu sekarang?`,ans:a-n*k,h:`${a} + ${n} \u00d7 ${p(-k)} = ${a} + ${s(-n*k)} = ${s(a-n*k)}.`}},
()=>{const b=rnd(2,8),w=rnd(1,6);return{st:1,x:`Dalam sebuah kuis, jawaban benar bernilai +4 dan jawaban salah bernilai \u22122. Sebuah tim menjawab ${b} soal benar dan ${w} soal salah. Berapa skor akhir tim itu?`,ans:4*b-2*w,h:`${b} \u00d7 4 + ${w} \u00d7 (\u22122) = ${4*b} + ${s(-2*w)} = ${s(4*b-2*w)}.`}}
];
const mk=()=>G.mode==='hit'?calc():G.mode==='cer'?pick(ST)():(Math.random()<.5?calc():pick(ST)());

function set(k,v){G[k]=v;setup()}
function setup(){
 const o=(key,arr)=>arr.map(([v,l])=>`<button class="btn${G[key]===v?' on':''}" onclick="set('${key}',${typeof v==='number'?v:`'${v}'`})">${l}</button>`).join('');
 app.innerHTML=`<a class="hm" href="index.html">← E-Matematika</a><h1>Perang Armada</h1><p class="mu">Kuis bilangan bulat untuk satu kelas. Tiap tim merebut sektor dengan menjawab soal isian.</p>
 <div class="pn"><b>Jumlah tim</b><div class="row" style="margin:8px 0 14px">${o('n',[[2,'2 tim'],[3,'3 tim'],[4,'4 tim']])}</div>
 <b>Jenis soal</b><div class="row" style="margin:8px 0 14px">${o('mode',[['hit','Hitungan'],['cer','Soal cerita'],['cam','Campuran']])}</div>
 <b>Waktu per soal</b><div class="row" style="margin-top:8px">${o('t',[[30,'30 detik'],[60,'1 menit'],[90,'90 detik'],[0,'Tanpa waktu']])}</div></div>
 <div class="row"><button class="btn go" onclick="start()">Mulai permainan</button><button class="btn" onclick="rules()">Aturan</button></div>`;
}
function start(){G.own=Array(50).fill(-1);G.pts=Array(G.n).fill(0);G.turn=0;board()}
function board(){
 const tm=T.slice(0,G.n).map((t,k)=>`<div class="tm${k===G.turn?' t':''}" style="border-color:${t.c}"><b style="color:${t.c}">${t.n}</b><br>${G.own.filter(o=>o===k).length} sektor, ${G.pts[k]} poin</div>`).join('');
 const cells=G.own.map((o,i)=>`<button class="sc" onclick="openSec(${i})"${o>=0?` style="background:${T[o].c};color:${T[o].f};border-color:${T[o].c}"`:''}>${i+1}</button>`).join('');
 app.innerHTML=`<div class="row">${tm}</div><p class="mu">Giliran: <b style="color:${T[G.turn].c}">${T[G.turn].n}</b>. Pilih sektor untuk diserang. Sektor milik tim lain boleh direbut.</p><div class="board">${cells}</div><div class="row" style="margin-top:14px"><button class="btn" onclick="rules()">Aturan</button><button class="btn" onclick="finish()">Akhiri permainan</button></div>`;
}
function openSec(i){
 G.sec=i;G.q=mk();G.done=false;
 G.att=G.own[i]===G.turn?(G.turn+1)%G.n:G.turn;
 const q=G.q,o=G.own[i];
 const at=T.slice(0,G.n).map((t,k)=>`<button class="btn at${k===G.att?' on':''}"${k===o?' disabled':''} onclick="setAtt(${k})" style="color:${t.c}">${t.n}</button>`).join('');
 md.innerHTML=`<div class="mc"><b>Target Sektor #${i+1}</b>${o>=0?` <span style="color:${T[o].c}">(dikuasai ${T[o].n})</span>`:''}
 ${G.t?'<div class="tb"><div id="tbf"></div></div><div class="mu" id="tt" style="text-align:right"></div>':''}
 <div class="qt">${q.st?q.x:q.x+' = ?'}</div>
 <input id="in" placeholder="Ketik jawaban, contoh: \u22125" autocomplete="off" onkeydown="if(event.key==='Enter')serang()">
 <p class="mu" style="margin:10px 0 6px">Armada penyerang:</p><div class="row">${at}</div><div id="fb" aria-live="polite"></div>
 <div class="row" style="margin-top:12px"><button class="btn go" id="go" onclick="serang()">Serang!</button><button class="btn" onclick="tutup()">Tutup</button></div></div>`;
 md.hidden=false;setTimeout(()=>g('in').focus(),50);startT();
}
function rules(){
 md.innerHTML=`<div class="mc"><b style="font-size:1.4rem">Aturan Perang Armada</b>
 <ol class="rl">
 <li>Kelas dibagi menjadi beberapa tim yang disebut armada. Tujuannya: merebut sektor sebanyak-banyaknya.</li>
 <li>Papan punya 50 sektor bernomor. Tiap sektor berisi satu soal operasi hitung bilangan bulat, berupa hitungan atau soal cerita.</li>
 <li>Armada yang mendapat giliran memilih satu sektor, lalu soal muncul di layar.</li>
 <li>Tim berdiskusi dan menyebutkan satu jawaban akhir berupa bilangan bulat. Perhatikan tanda positif dan negatifnya. Jawaban harus disebutkan sebelum waktu habis.</li>
 <li>Jawaban benar: armada merebut sektor itu dan mendapat 10 poin.</li>
 <li>Jawaban salah atau waktu habis: tidak ada poin dan sektor tidak berpindah. Jawaban yang benar ditampilkan.</li>
 <li>Sektor milik armada lain boleh direbut dengan menjawab soal barunya dengan benar.</li>
 <li>Setelah satu soal dijawab, giliran pindah otomatis ke armada berikutnya.</li>
 <li>Permainan berakhir saat guru menekan "Akhiri permainan".</li>
 <li>Pemenang adalah armada dengan sektor terbanyak. Kalau sama, dilihat dari poin tertinggi.</li>
 </ol>
 <b>Saran kesepakatan kelas</b>
 <ol class="rl"><li>Hanya jawaban pertama dari juru bicara tim yang dihitung.</li><li>Tim lain tidak boleh menjawab atau memberi petunjuk saat bukan gilirannya.</li></ol>
 <div class="row"><button class="btn go" onclick="md.hidden=true">Mengerti</button></div></div>`;
 md.hidden=false;
}
function stopT(){if(TM){clearInterval(TM);TM=null}}
function startT(){
 stopT();if(!G.t)return;
 const lim=G.t*1000,t0=Date.now(),f=g('tbf'),tt=g('tt');
 TM=setInterval(()=>{
  const r=Math.max(0,lim-(Date.now()-t0)),pc=r/lim*100;
  f.style.width=pc+'%';f.style.background=pc<25?'var(--no)':pc<50?'#ffd23f':'var(--ok)';
  tt.textContent=Math.ceil(r/1000)+' detik';
  if(r<=0){stopT();timeUp()}
 },200);
}
function timeUp(){
 if(G.done)return;
 G.done=true;const k=G.att;
 g('fb').innerHTML=`<div class="fb no"><b>Waktu habis. Jawaban yang benar: ${s(G.q.ans)}</b><span>${G.q.h}</span></div>`;
 g('in').disabled=true;document.querySelectorAll('.at').forEach(b=>b.disabled=true);
 g('go').textContent='Lanjut';G.turn=(k+1)%G.n;
}
function setAtt(k){G.att=k;document.querySelectorAll('.at').forEach((b,j)=>b.classList.toggle('on',j===k))}
function serang(){
 if(G.done)return tutup();
 const v=g('in').value.replace(/\u2212/g,'-').replace(/\s/g,'');
 if(!/^[-+]?\d+$/.test(v)){g('fb').innerHTML='<div class="fb no">Ketik bilangan bulat saja, contoh: \u22125 atau 12.</div>';return}
 stopT();G.done=true;const ok=+v===G.q.ans,k=G.att;
 if(ok){G.own[G.sec]=k;G.pts[k]+=10}
 g('fb').innerHTML=ok?`<div class="fb ok"><b>Tepat! ${T[k].n} merebut sektor ${G.sec+1}.</b><span>${G.q.h}</span></div>`:`<div class="fb no"><b>Belum tepat. Jawaban yang benar: ${s(G.q.ans)}</b><span>${G.q.h}</span></div>`;
 g('in').disabled=true;document.querySelectorAll('.at').forEach(b=>b.disabled=true);
 g('go').textContent='Lanjut';G.turn=(k+1)%G.n;
}
function tutup(){stopT();md.hidden=true;board()}
function finish(){
 const r=T.slice(0,G.n).map((t,k)=>({k,s:G.own.filter(o=>o===k).length,p:G.pts[k]})).sort((a,b)=>b.s-a.s||b.p-a.p);
 app.innerHTML=`<h1>Hasil Perang Armada</h1><div class="pn">${r.map((e,i)=>`<div class="rk" style="border-color:${T[e.k].c}"><span>${i===0?'\ud83c\udfc6':i+1}</span><b style="color:${T[e.k].c}">${T[e.k].n}</b><span>${e.s} sektor, ${e.p} poin</span></div>`).join('')}</div><p class="mu">Urutan dihitung dari jumlah sektor, lalu poin.</p><div class="row"><button class="btn go" onclick="setup()">Main lagi</button><button class="btn" onclick="board()">Kembali ke papan</button></div>`;
}
setup();
</script>
</body>
</html>
